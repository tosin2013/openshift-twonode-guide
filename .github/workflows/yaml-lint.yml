---
name: YAML Lint

on:
  push:
    branches: [main]
    paths:
      - 'examples/**/*.yml'
      - 'examples/**/*.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'examples/**/*.yml'
      - 'examples/**/*.yaml'

jobs:
  yaml-lint:
    name: Lint YAML templates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint examples/two-node-fencing/
        run: |
          yamllint -d '{
            extends: default,
            rules: {
              line-length: {max: 120},
              comments: disable,
              document-start: disable,
              truthy: {allowed-values: ["true", "false", "yes", "no"]}
            }
          }' examples/two-node-fencing/

      - name: Lint examples/two-node-drbd/
        run: |
          yamllint -d '{
            extends: default,
            rules: {
              line-length: {max: 120},
              comments: disable,
              document-start: disable,
              truthy: {allowed-values: ["true", "false", "yes", "no"]}
            }
          }' examples/two-node-drbd/

      - name: Check for placeholder values left in templates
        run: |
          # Warn if any example template still contains obvious placeholder strings
          PLACEHOLDERS=$(grep -rn \
            'YOUR_PULL_SECRET\|<YOUR_\|PLACEHOLDER\|TODO:' \
            examples/two-node-fencing/ examples/two-node-drbd/ \
            --include='*.yml' --include='*.yaml' || true)
          if [[ -n "$PLACEHOLDERS" ]]; then
            echo "::warning::Placeholder values found in templates:"
            echo "$PLACEHOLDERS"
          fi
