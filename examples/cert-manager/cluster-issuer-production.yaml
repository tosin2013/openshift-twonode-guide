---
# Let's Encrypt PRODUCTION ClusterIssuer.
#
# WARNING: Only apply this after staging ClusterIssuer succeeds and you have
# verified that certificates issue correctly. The production issuer has strict
# rate limits (5 duplicate certificates per week per registered domain).
#
# Rate limits reference: https://letsencrypt.org/docs/rate-limits/
#
# REQUIRED before applying:
#   1. Replace REPLACE_ME_BASE_DOMAIN with your actual base domain
#   2. Configure the correct solver (same as staging issuer)
#   3. Ensure your DNS provider secret exists in the cert-manager namespace
#      (the operator creates the cert-manager namespace automatically)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # Replace with a real email address — Let's Encrypt sends expiry notices here
    email: admin@REPLACE_ME_BASE_DOMAIN
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    solvers:
      # ── AWS Route53 ──────────────────────────────────────────────────────
      # Uncomment and configure if your DNS is hosted on Route53
      # - dns01:
      #     route53:
      #       region: us-east-1
      #       accessKeyIDSecretRef:
      #         name: route53-credentials
      #         key: access-key-id
      #       secretAccessKeySecretRef:
      #         name: route53-credentials
      #         key: secret-access-key

      # ── Cloudflare ───────────────────────────────────────────────────────
      # Uncomment and configure if your DNS is hosted on Cloudflare
      # - dns01:
      #     cloudflare:
      #       apiTokenSecretRef:
      #         name: cloudflare-api-token
      #         key: api-token

      # ── Google Cloud DNS ─────────────────────────────────────────────────
      # Uncomment and configure if your DNS is hosted on Google Cloud DNS
      # - dns01:
      #     cloudDNS:
      #       project: REPLACE_ME_GCP_PROJECT_ID
      #       serviceAccountSecretRef:
      #         name: gcp-dns-sa
      #         key: service-account.json

      # ── Fallback: leave one solver enabled ───────────────────────────────
      - dns01:
          # Replace with your actual solver configuration above
          route53:
            region: us-east-1
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
