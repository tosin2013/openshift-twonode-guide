---
# Cloudflare DNS provider Secret for cert-manager DNS-01 solver.
#
# Use a Cloudflare API Token (not Global API Key) with the minimum permissions:
#   Zone → DNS → Edit
#   Zone → Zone → Read
#
# Create the token at:
#   https://dash.cloudflare.com/profile/api-tokens
#   → Create Token → Custom Token
#   → Zone:DNS:Edit + Zone:Zone:Read for the specific zone
#
# Apply with:
#   oc apply -f cloudflare-secret.yaml -n cert-manager
#
# Then reference in ClusterIssuer:
#   dns01:
#     cloudflare:
#       apiTokenSecretRef:
#         name: cloudflare-api-token
#         key: api-token
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: REPLACE_ME_CLOUDFLARE_API_TOKEN
