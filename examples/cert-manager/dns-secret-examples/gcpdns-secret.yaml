---
# Google Cloud DNS provider Secret for cert-manager DNS-01 solver.
#
# Required IAM roles for the service account:
#   - roles/dns.admin  (or a custom role with dns.changes.create,
#     dns.changes.get, dns.resourceRecordSets.*)
#
# Create the service account and download its JSON key:
#   gcloud iam service-accounts create cert-manager-dns01 \
#     --display-name "cert-manager DNS-01 solver"
#
#   gcloud projects add-iam-policy-binding REPLACE_ME_GCP_PROJECT_ID \
#     --member "serviceAccount:cert-manager-dns01@REPLACE_ME_GCP_PROJECT_ID.iam.gserviceaccount.com" \
#     --role "roles/dns.admin"
#
#   gcloud iam service-accounts keys create sa-key.json \
#     --iam-account cert-manager-dns01@REPLACE_ME_GCP_PROJECT_ID.iam.gserviceaccount.com
#
# Then create the secret from the downloaded key file:
#   oc create secret generic gcp-dns-sa \
#     --from-file=service-account.json=sa-key.json \
#     -n cert-manager
#
# Or apply this file after replacing the JSON key content below:
#
# Then reference in ClusterIssuer:
#   dns01:
#     cloudDNS:
#       project: REPLACE_ME_GCP_PROJECT_ID
#       serviceAccountSecretRef:
#         name: gcp-dns-sa
#         key: service-account.json
apiVersion: v1
kind: Secret
metadata:
  name: gcp-dns-sa
  namespace: cert-manager
type: Opaque
stringData:
  service-account.json: |
    {
      "type": "service_account",
      "project_id": "REPLACE_ME_GCP_PROJECT_ID",
      "private_key_id": "REPLACE_ME_KEY_ID",
      "private_key": "REPLACE_ME_PRIVATE_KEY",
      "client_email": "cert-manager-dns01@REPLACE_ME_GCP_PROJECT_ID.iam.gserviceaccount.com",
      "client_id": "REPLACE_ME_CLIENT_ID",
      "auth_uri": "https://accounts.google.com/o/oauth2/auth",
      "token_uri": "https://oauth2.googleapis.com/token",
      "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
      "client_x509_cert_url": "REPLACE_ME_CERT_URL"
    }
