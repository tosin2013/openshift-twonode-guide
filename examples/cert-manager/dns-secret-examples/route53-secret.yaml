---
# AWS Route53 DNS provider Secret for cert-manager DNS-01 solver.
#
# Required IAM permissions for the access key:
#   - route53:GetChange
#   - route53:ChangeResourceRecordSets
#   - route53:ListHostedZonesByName
#   - route53:ListResourceRecordSets
#
# Minimal IAM policy (replace HOSTED_ZONE_ID with your zone ID):
#
#   {
#     "Version": "2012-10-17",
#     "Statement": [
#       {
#         "Effect": "Allow",
#         "Action": ["route53:GetChange"],
#         "Resource": "arn:aws:route53:::change/*"
#       },
#       {
#         "Effect": "Allow",
#         "Action": [
#           "route53:ChangeResourceRecordSets",
#           "route53:ListResourceRecordSets"
#         ],
#         "Resource": "arn:aws:route53:::hostedzone/REPLACE_ME_HOSTED_ZONE_ID"
#       },
#       {
#         "Effect": "Allow",
#         "Action": ["route53:ListHostedZonesByName"],
#         "Resource": "*"
#       }
#     ]
#   }
#
# Apply with:
#   oc apply -f route53-secret.yaml -n cert-manager
#
# Then reference in ClusterIssuer:
#   dns01:
#     route53:
#       region: us-east-1
#       accessKeyIDSecretRef:
#         name: route53-credentials
#         key: access-key-id
#       secretAccessKeySecretRef:
#         name: route53-credentials
#         key: secret-access-key
apiVersion: v1
kind: Secret
metadata:
  name: route53-credentials
  namespace: cert-manager
type: Opaque
stringData:
  access-key-id: REPLACE_ME_AWS_ACCESS_KEY_ID
  secret-access-key: REPLACE_ME_AWS_SECRET_ACCESS_KEY
